
<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registra't a NBA Top 75 i crea el teu compte.">
    <title>NBA Top 75 - Registre</title>

    <!-- Tipografia Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- ESTILS D'ACCESSIBILITAT -->
    <style>
        .skip-link {
            position: absolute;
            top: 0.5rem;
            left: -9999px;
            z-index: 100;
            padding: 0.75rem 1rem;
            color: #000000;
            background: #ffffff;
            border: 2px solid #17408B;
            border-radius: 0.5rem;
        }

        .skip-link:focus {
            left: 0.5rem;
        }

        /* Focus visible per a tots els elements interactius */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 0.1875rem solid #17408B;
            outline-offset: 0.1875rem;
        }

        /* Respectar la preferència de moviment reduït */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="m-0 flex min-h-screen flex-col items-center bg-[#ececec] font-['Oswald'] text-black">

    <!-- ENLLAÇ PER SALTAR LA NAVEGACIÓ -->
    <a href="#contingut-principal" class="skip-link">
        Saltar al contingut principal
    </a>

    <!-- CONTINGUT PRINCIPAL -->
    <main id="contingut-principal" tabindex="-1"
        class="flex flex-1 w-full items-center justify-center px-[0.9375rem] py-[0.9375rem]">

        <!-- CONTENIDOR PRINCIPAL -->
        <div
            class="flex min-h-[35rem] w-[75%] max-w-[62.5rem] rounded-[1.5625rem] border-[0.1875rem] border-black bg-white shadow-[0_0.625rem_1.875rem_rgba(0,0,0,0.15)] max-[62rem]:h-auto max-[62rem]:min-h-[32.5rem] max-[62rem]:w-[90%] max-[62rem]:flex-col">

            <!-- ZONA ESQUERRA -->
            <section aria-label="Navegació i logotip"
                class="flex flex-1 flex-col items-center justify-center">

                <!-- LOGO NBA -->
                <img src="img/images.jpg" alt="Logotip de l'NBA"
                    class="w-[20rem] max-w-[85%] object-contain max-[62rem]:mt-5 max-[62rem]:w-[15.625rem]">

                <!-- BOTONS DE NAVEGACIÓ -->
                <nav aria-label="Navegació del compte"
                    class="mt-5 flex gap-[0.9375rem] max-[36rem]:flex-col max-[36rem]:gap-[0.625rem]">

                    <a href="login.html"
                        class="rounded-[1.25rem] border-2 border-black bg-[#3A6AA7] px-[1.5625rem] py-[0.625rem] font-bold text-black no-underline transition-colors duration-300 hover:bg-[#17408B] hover:text-white">
                        INICIA LA SESSIÓ
                    </a>

                    <a href="inici.html"
                        class="rounded-[1.25rem] border-2 border-black bg-[#3A6AA7] px-[1.5625rem] py-[0.625rem] font-bold text-black no-underline transition-colors duration-300 hover:bg-[#17408B] hover:text-white">
                        TORNAR
                    </a>

                </nav>

            </section>

            <!-- ZONA DRETA -->
            <section aria-labelledby="titol-registre"
                class="flex w-[26.875rem] flex-col justify-center p-[1.875rem] max-[62rem]:w-full max-[36rem]:p-5">

                <h1 id="titol-registre"
                    class="mb-[1.5625rem] text-center text-[3rem] font-bold text-[#3A6AA7] max-[36rem]:text-[2.2rem]">
                    REGISTRE
                </h1>

                <!-- FORMULARI -->
                <form id="register-form" class="w-full" novalidate>

                    <!-- USUARI -->
                    <label for="user" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                        USUARI
                    </label>

                    <input type="text" id="user" name="user"
                        placeholder="Introdueix el teu usuari"
                        autocomplete="username" required
                        aria-describedby="user-error"
                        class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B]">

                    <p id="user-error" class="mb-2 ml-[0.625rem] text-sm text-[#B00020]"
                        aria-live="polite"></p>

                    <!-- CONTRASENYA -->
                    <label for="password" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                        CONTRASENYA
                    </label>

                    <input type="password" id="password" name="password"
                        placeholder="Introdueix la contrasenya"
                        autocomplete="new-password" required
                        aria-describedby="password-error"
                        class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B]">

                    <p id="password-error" class="mb-2 ml-[0.625rem] text-sm text-[#B00020]"
                        aria-live="polite"></p>

                    <!-- REPETIR CONTRASENYA -->
                    <label for="repeat-password" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                        REPETEIX LA CONTRASENYA
                    </label>

                    <input type="password" id="repeat-password" name="repeat-password"
                        placeholder="Torna a introduir la contrasenya"
                        autocomplete="new-password" required
                        aria-describedby="repeat-password-error"
                        class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B]">

                    <p id="repeat-password-error" class="mb-2 ml-[0.625rem] text-sm text-[#B00020]"
                        aria-live="assertive"></p>

                    <!-- CORREU ELECTRÒNIC -->
                    <label for="email" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                        CORREU ELECTRÒNIC
                    </label>

                    <input type="email" id="email" name="email"
                        placeholder="Introdueix el teu correu electrònic"
                        autocomplete="email" required
                        aria-describedby="email-error"
                        class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B]">

                    <p id="email-error" class="mb-2 ml-[0.625rem] text-sm text-[#B00020]"
                        aria-live="polite"></p>

                    <!-- MISSATGE GENERAL D'ERROR -->
                    <p id="form-error" role="alert"
                        class="mb-2 text-center text-sm font-bold text-[#B00020]">
                    </p>

                    <!-- BOTÓ DE REGISTRE -->
                    <button type="submit"
                        class="mx-auto mt-[0.625rem] block cursor-pointer rounded-[1.25rem] border-2 border-black bg-[#ff002f] px-[1.875rem] py-[0.625rem] text-[0.9rem] font-bold text-black transition-colors duration-300 hover:bg-[#17408B] hover:text-white">

                        REGISTRA'T

                    </button>

                </form>

            </section>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-[#101010] px-4 py-5 text-center">
        <p class="text-sm text-gray-400">
            © 2026 NBA Top 75. Tots els drets reservats.
        </p>
    </footer>

    <!-- VALIDACIÓ ACCESSIBLE DEL FORMULARI -->
    <script>
        const form = document.getElementById("register-form");

        const user = document.getElementById("user");
        const password = document.getElementById("password");
        const repeatPassword = document.getElementById("repeat-password");
        const email = document.getElementById("email");

        const formError = document.getElementById("form-error");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            // Netejar missatges anteriors
            document.querySelectorAll("#register-form input").forEach(input => {
                input.removeAttribute("aria-invalid");
            });

            document.querySelectorAll("#register-form p[id$='error']").forEach(error => {
                error.textContent = "";
            });

            formError.textContent = "";

            // Comprovar camps obligatoris
            if (!user.value.trim()) {
                user.setAttribute("aria-invalid", "true");
                document.getElementById("user-error").textContent =
                    "Introdueix un nom d'usuari.";
                user.focus();
                return;
            }

            if (!password.value) {
                password.setAttribute("aria-invalid", "true");
                document.getElementById("password-error").textContent =
                    "Introdueix una contrasenya.";
                password.focus();
                return;
            }

            if (!repeatPassword.value) {
                repeatPassword.setAttribute("aria-invalid", "true");
                document.getElementById("repeat-password-error").textContent =
                    "Repeteix la contrasenya.";
                repeatPassword.focus();
                return;
            }

            if (!email.value.trim()) {
                email.setAttribute("aria-invalid", "true");
                document.getElementById("email-error").textContent =
                    "Introdueix el teu correu electrònic.";
                email.focus();
                return;
            }

            // Comprovar format del correu electrònic
            if (!email.validity.valid) {
                email.setAttribute("aria-invalid", "true");
                document.getElementById("email-error").textContent =
                    "Introdueix una adreça de correu electrònic vàlida.";
                email.focus();
                return;
            }

            // Comprovar que les contrasenyes coincideixin
            if (password.value !== repeatPassword.value) {
                repeatPassword.setAttribute("aria-invalid", "true");

                document.getElementById("repeat-password-error").textContent =
                    "Les contrasenyes no coincideixen. Torna-les a introduir.";

                repeatPassword.focus();
                return;
            }

            // El formulari supera les comprovacions locals
            formError.textContent =
                "Les dades són correctes. La creació del compte encara no està connectada al servidor.";
        });

        // Eliminar l'estat d'error quan l'usuari modifica un camp
        document.querySelectorAll("#register-form input").forEach(input => {
            input.addEventListener("input", function () {
                this.removeAttribute("aria-invalid");

                const error = document.getElementById(this.id + "-error");

                if (error) {
                    error.textContent = "";
                }

                formError.textContent = "";
            });
        });
    </script>

</body>

</html>
