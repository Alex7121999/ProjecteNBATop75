<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Top 75 - Registre</title>

    <!-- Tipografia Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-0 flex min-h-screen items-center justify-center bg-[#ececec] p-[0.9375rem] font-['Oswald'] text-black">

    <!-- CONTENIDOR PRINCIPAL -->
    <div
        class="flex h-[35rem] w-[75%] max-w-[62.5rem] rounded-[1.5625rem] border-[0.1875rem] border-black bg-white shadow-[0_0.625rem_1.875rem_rgba(0,0,0,0.15)] max-[62rem]:h-auto max-[62rem]:min-h-[32.5rem] max-[62rem]:w-[90%] max-[62rem]:flex-col">

        <!-- ZONA ESQUERRA -->
        <div class="flex flex-1 flex-col items-center justify-center">

            <!-- LOGO NBA -->
            <img src="img/images.jpg" alt="Logotip de l'NBA"
                class="w-[20rem] max-w-[85%] object-contain max-[62rem]:mt-5 max-[62rem]:w-[15.625rem]">

            <!-- BOTONS DE NAVEGACIÓ -->
            <div class="mt-5 flex gap-[0.9375rem] max-[36rem]:flex-col max-[36rem]:gap-[0.625rem]">

                <a href="login.html"
                    class="rounded-[1.25rem] border-2 border-black bg-[#3A6AA7] px-[1.5625rem] py-[0.625rem] font-bold text-black no-underline transition-colors duration-300 hover:bg-[#17408B] hover:text-white">
                    INICIA LA SESSIÓ
                </a>

                <a href="inici.html"
                    class="rounded-[1.25rem] border-2 border-black bg-[#3A6AA7] px-[1.5625rem] py-[0.625rem] font-bold text-black no-underline transition-colors duration-300 hover:bg-[#17408B] hover:text-white">
                    TORNAR
                </a>

            </div>

        </div>

        <!-- ZONA DRETA -->
        <div class="flex w-[26.875rem] flex-col justify-center p-[1.875rem] max-[62rem]:w-full max-[36rem]:p-5">

            <h1 class="mb-[1.5625rem] text-center text-[3rem] font-bold text-[#3A6AA7] max-[36rem]:text-[2.2rem]">
                REGISTRE
            </h1>

            <!-- FORMULARI -->
            <form class="w-full">

                <!-- USUARI -->
                <label for="user" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                    USUARI
                </label>

                <input type="text" id="user" name="user" placeholder="Introdueix el teu usuari"
                    class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B] focus:outline-none">

                <!-- CONTRASENYA -->
                <label for="password" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                    CONTRASENYA
                </label>

                <input type="password" id="password" name="password" placeholder="Introdueix la contrasenya"
                    class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B] focus:outline-none">

                <!-- REPETIR CONTRASENYA -->
                <label for="repeat-password" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                    REPETEIX LA CONTRASENYA
                </label>

                <input type="password" id="repeat-password" name="repeat-password"
                    placeholder="Torna a introduir la contrasenya"
                    class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B] focus:outline-none">

                <!-- CORREU ELECTRÒNIC -->
                <label for="email" class="mb-1 ml-[0.625rem] block text-[0.7rem] font-bold">
                    CORREU ELECTRÒNIC
                </label>

                <input type="email" id="email" name="email" placeholder="Introdueix el teu correu electrònic"
                    class="mb-3 h-[3rem] w-full rounded-[1.25rem] border-2 border-black bg-[#d2d2d2] px-[0.9375rem] py-[0.625rem] text-[0.9rem] placeholder:text-[#555] focus:border-[#17408B] focus:outline-none">

                <!-- BOTÓ DE REGISTRE -->
                <button type="submit"
                    class="mx-auto mt-[0.625rem] block cursor-pointer rounded-[1.25rem] border-2 border-black bg-[#ff002f] px-[1.875rem] py-[0.625rem] text-[0.9rem] font-bold text-white transition-colors duration-300 hover:bg-[#17408B]">

                    REGISTRA'T

                </button>

            </form>

        </div>

    </div>

</body>

</html>
